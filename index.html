<!doctype html>
<html lang="id" data-theme="light" data-accent="blue" data-glass="liquid" data-bg="aurora">
<head>
<meta charset="utf-8">
<script src="/amatu.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amatu Docs</title>
<meta name="description" content="Amatu Docs — pengolah dokumen di browser: tulis, format, tinjau, beri komentar, dan ekspor ke Word atau PDF.">
<meta name="theme-color" content="#eef2f7">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,300..500,0..1,0&display=block">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/doc.css">
<script>
(function(){try{var p=JSON.parse(localStorage.getItem('adocs.ui')||'{}'),m=p.mode||'system',r=document.documentElement,
d=m==='dark'||(m==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);
r.dataset.theme=d?'dark':'light';r.dataset.accent=p.accent||'blue';r.dataset.glass=p.glass||'liquid';r.dataset.bg=p.bg||'aurora';
if(window.chrome)r.classList.add('can-refract')}catch(e){}})();
</script>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div id="app"></div>
<noscript><p style="padding:40px;font:16px system-ui">Amatu Docs memerlukan JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
